# alembic.ini — Alembic migration configuration

[alembic]
script_location = migrations

# Use environment variable for DB URL (loaded by env.py)
# sqlalchemy.url is overridden in migrations/env.py
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/smart_waste

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
